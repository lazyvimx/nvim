name: Release

# Мёрж в main только обновляет релизный PR, который ведёт release-please.
# Мёрж этого PR выпускает релиз, а сайт после него пересобирается со свежими доками.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_only:
        description: Only redeploy the docs site, skip the release
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - id: release
        uses: aimuzov-projects/infra-site-kit/release@v1

  # Сайт берёт доки из main на каждой сборке, так что после релиза достаточно
  # передеплоить его последний тег.
  site:
    needs: release
    if: >-
      always() &&
      (needs.release.outputs.created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.site_only))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GITHUB_TOKEN не запускает workflow в чужом репозитории, отсюда fine-grained PAT
      # с actions:write и contents:read на lazyvimx/site.
      - name: Redeploy the docs site
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          # Лишние пробелы во вставленном секрете ломают заголовок авторизации, и gh получает 401.
          GH_TOKEN="$(printf '%s' "$GH_TOKEN" | tr -d '[:space:]')"
          export GH_TOKEN

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DEPLOY_TOKEN is not set, run the lazyvimx/site deploy manually"
            exit 0
          fi

          tag=$(gh release view -R lazyvimx/site --json tagName -q .tagName)
          gh workflow run deploy.yml -R lazyvimx/site -f tag="$tag"
          echo "lazyvimx/site $tag redeploys with the fresh docs"
